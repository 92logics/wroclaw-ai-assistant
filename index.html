<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wirtualny Asystent WNS — prototyp 92 Logics</title>
  <meta name="description" content="Scripted prototype by 92 Logics of a RAG virtual assistant for foreign candidates and foreign students at the Faculty of Social Sciences, University of Wrocław. Not an official university system.">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="banner" id="banner"></div>
  <header class="mast">
    <div class="brand">
      <div class="mark" aria-hidden="true">92</div>
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
      </div>
    </div>
    <div class="lang" role="group" id="lang" aria-label="Language">
      <button type="button" data-lang="pl" aria-pressed="true">Polski</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>
  <main class="shell">
    <aside class="rail" id="rail"></aside>
    <section class="stage" aria-labelledby="stage-name">
      <div class="stage-bar">
        <div class="who">
          <p class="kicker" id="stage-kicker"></p>
          <p class="name" id="stage-name"></p>
        </div>
        <p class="status" id="stage-status"></p>
      </div>
      <div id="gate" class="gate" hidden></div>
      <div id="chat">
        <div id="log" class="log" role="log" aria-live="polite"></div>
        <div class="composer">
          <div id="chips" class="chips"></div>
          <form id="form" class="ask">
            <label class="sr" for="q" id="q-label"></label>
            <input id="q" name="q" autocomplete="off" enterkeyhint="send">
            <button type="submit" id="send"></button>
          </form>
          <div class="composer-row">
            <span class="meta" id="hint"></span>
            <button type="button" class="ghost" id="reset"></button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-foot">
    <p id="foot-local"></p>
    <p class="legal">Prototype by 92 Logics · cowork@92logics.com · not an official university system.</p>
  </footer>
  <noscript>
    <p style="padding:1rem">This prototype needs JavaScript for the scripted conversation. It does not call an external AI service.</p>
  </noscript>
  <script src="js/app.js"></script>
</body>
</html>
